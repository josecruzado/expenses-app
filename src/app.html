<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		
		<!-- Basic Meta Tags -->
		<meta name="description" content="Aplicación personal para gestionar gastos optimizada para iOS" />
		<meta name="keywords" content="gastos, presupuesto, finanzas, iOS, PWA" />
		<meta name="author" content="Expenses App" />
		
		<!-- Viewport and PWA Meta Tags -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Expenses" />
		
		<!-- iOS Specific Meta Tags for Native App Experience -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Expenses" />

		<!-- Theme Colors (light/dark via media queries) -->
		<!-- Bare tag sin `media` para que JS pueda sobrescribirla dinámicamente
		     (dynamic-island.ts). Las dos siguientes son las que el sistema
		     elige automáticamente según el esquema. -->
		<meta name="theme-color" content="#f2f2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
		<meta name="msapplication-navbutton-color" content="#000000" />
		
		<!-- iOS Safe Area Support -->
		<meta name="supported-color-schemes" content="light dark" />
		<meta name="color-scheme" content="light dark" />
		
		<!-- Manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		
		<!-- Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" sizes="167x167" href="%sveltekit.assets%/apple-touch-icon-167x167.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="%sveltekit.assets%/apple-touch-icon-152x152.png" />
		<link rel="apple-touch-icon" sizes="120x120" href="%sveltekit.assets%/apple-touch-icon-120x120.png" />

		<!-- Preconnect for performance -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
